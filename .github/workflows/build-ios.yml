name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Export IPA
    runs-on: macos-latest
    
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Build Archive
      run: |
        xcodebuild clean archive \
          -project MaciOS.xcodeproj \
          -scheme MaciOS \
          -configuration Release \
          -archivePath ${{ runner.temp }}/MaciOS.xcarchive \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        # Create export options plist
        cat > ${{ runner.temp }}/ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
        </dict>
        </plist>
        EOF
        
        # Export archive to IPA
        xcodebuild -exportArchive \
          -archivePath ${{ runner.temp }}/MaciOS.xcarchive \
          -exportPath ${{ runner.temp }}/MaciOS \
          -exportOptionsPlist ${{ runner.temp }}/ExportOptions.plist \
          -allowProvisioningUpdates || true
        
        # If export fails (due to code signing), manually package the app
        if [ ! -f "${{ runner.temp }}/MaciOS/MaciOS.ipa" ]; then
          echo "Standard export failed, creating unsigned IPA..."
          mkdir -p ${{ runner.temp }}/Payload
          cp -r ${{ runner.temp }}/MaciOS.xcarchive/Products/Applications/MaciOS.app ${{ runner.temp }}/Payload/
          cd ${{ runner.temp }}
          zip -r MaciOS.ipa Payload
          mkdir -p MaciOS
          mv MaciOS.ipa MaciOS/
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaciOS-IPA
        path: ${{ runner.temp }}/MaciOS/MaciOS.ipa
        retention-days: 30

    - name: Upload Archive Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MaciOS-Archive
        path: ${{ runner.temp }}/MaciOS.xcarchive
        retention-days: 30
